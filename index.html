const cats=["All",...new Set(DATA.map(x=>x.c))];
let cat="All", q="";
const chips=document.getElementById('chips'), grid=document.getElementById('grid');
cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='All'?' on':'');b.textContent=c;b.onclick=()=>{cat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.textContent===c));draw()};chips.appendChild(b)});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();draw()});
function av(a){return a<=1?'<div class="av">Only 1 left</div>':'<div class="av ok">In stock</div>'}
function draw(){grid.innerHTML='';DATA.filter(x=>(cat==='All'||x.c===cat)&&x.t.toLowerCase().includes(q)).forEach(x=>{
 const d=document.createElement('div');d.className='card';
 d.innerHTML=`<div class="ph"><img loading="lazy" src="${x.img}" alt=""><span class="badge">No. ${x.n}</span></div><div class="body"><div class="t">${x.t}</div><div class="pr">$${x.p}</div>${av(x.a)}<a class="btn" href="${MME}" target="_blank" rel="noopener">I'm interested</a></div>`;
 d.querySelector('img').onclick=()=>open_(x); d.querySelector('.t').onclick=()=>open_(x); grid.appendChild(d);});}
function open_(x){const s=document.getElementById('sheet');
 s.innerHTML=`<img src="${x.img}" alt=""><div class="body"><button class="back" onclick="close_()">&#8592; Back</button><div class="bign" style="margin-top:12px">No. ${x.n} &middot; ${x.c}</div><div class="t">${x.t}</div><div class="pr">$${x.p}</div>${av(x.a)}<div class="tip">New &middot; Local pickup in Ottumwa</div>${x.red?'<div class="red">(For more images of this product, please ask in the private chat &mdash; they can\'t be shown in this catalog due to anatomy restrictions.)</div>':''}<div class="tip">Tip: tell us the product number (No. ${x.n}) so we know exactly which one you want.</div><a class="btn" href="${MME}" target="_blank" rel="noopener">I'm interested</a></div>`;
 document.getElementById('ov').style.display='block';}
function close_(){document.getElementById('ov').style.display='none'}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')close_()});
draw();
